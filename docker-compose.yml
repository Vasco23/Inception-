volumes:

  mariadb:
    name: mariadb
    driver: local
    driver_opts :
      device: /home/vasco/data/mariadb
      o: bind
      type: none

  wordpress:
    name: wordpress
    driver: local
    driver_opts :
      device: /home/vasco/data/wordpress
      o: bind
      type: none
    
networks:
 inception:
  driver: bridge

services:
  mariadb:
    build:
      context: ./srcs/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: .env
    volumes: 
      - mariadb:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - inception
    restart: on-failure
  
  wordpress:
    build:
      context: ./srcs/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    ports:
      - "9000:9000"
    networks:
      - inception
    restart: on-failure
  
  nginx:
    build:
      context: ./srcs/nginx
      dockerfile: Dockerfile
    container_name: nginx
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception
    restart: on-failure


